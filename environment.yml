# Conda environment for email-archiver.
#   conda env create -f environment.yml
#   conda activate email-archiver
# After changing this file:  conda env update -f environment.yml --prune
name: email-archiver
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # PDF rendering (Phase 3+). conda-forge supplies WeasyPrint's native
  # libraries (pango, cairo, harfbuzz), so no Homebrew is needed.
  - weasyprint=69.0
  - pypdf=7.0.0
  - nh3=0.3.7          # HTML sanitizer for untrusted email bodies
  - pip:
      - -e .
